# Análisis en SonarCloud (https://sonarcloud.io) — lo ejecuta .github/workflows/sonarcloud.yml
sonar.projectKey=AnaFiquitiva_kata-practicing
sonar.organization=anafiquitiva
sonar.projectName=Kata Practicing
sonar.sourceEncoding=UTF-8

# Código: back-end (Java) y front-end (HTML/CSS/JS)
sonar.sources=backend/src/main,frontend
sonar.tests=backend/src/test
sonar.exclusions=frontend/img/**
# Cobertura: la clase de arranque no tiene lógica, FormularioRegistroDoc solo documenta Swagger (nunca se
# instancia) y el front-end aún no tiene pruebas automatizadas (sus archivos sí se analizan en busca de
# bugs, vulnerabilidades y code smells).
sonar.coverage.exclusions=backend/src/main/java/com/bdb/katapracticing/PracticantesApplication.java,backend/src/main/java/com/bdb/katapracticing/practicantes/web/FormularioRegistroDoc.java,frontend/**

# Java: clases compiladas, dependencias y cobertura de JaCoCo
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.java.test.libraries=backend/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=backend/target/surefire-reports
