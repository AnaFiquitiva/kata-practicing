spring.application.name=kata-practicing
server.port=8080

# El back-end corre detrás de Nginx (front-end); respeta las cabeceras X-Forwarded-*.
server.forward-headers-strategy=native

# --- Base de datos SQLite ---
# En Docker: SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/practicantes.db (volumen persistente).
# Sin Docker (mvn spring-boot:run desde backend/): se usa ../backend_data/db/practicantes.db.
spring.datasource.url=jdbc:sqlite:../backend_data/db/practicantes.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor a la vez
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Archivos (hojas de vida) ---
# En Docker: APP_UPLOADS_DIR=/app/uploads (volumen persistente).
app.uploads.dir=../backend_data/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Credenciales del analista (variables de entorno ANALISTA_USUARIO / ANALISTA_PASSWORD) ---
app.analista.usuario=${ANALISTA_USUARIO:analista}
app.analista.password=${ANALISTA_PASSWORD:Bogota2026*}

# --- Health check para Docker ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jackson.serialization.write-dates-as-timestamps=false

# --- Paginación: tamaño máximo por página (protege a la API de peticiones enormes) ---
spring.data.web.pageable.max-page-size=100

# --- Documentación OpenAPI / Swagger UI ---
# Bajo /api para que también funcione detrás de Nginx: http://localhost:3000/api/docs/swagger-ui.html
springdoc.api-docs.path=/api/docs/openapi
springdoc.swagger-ui.path=/api/docs/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.default-produces-media-type=application/hal+json
